services:
  orchestrator:
    image: automata-worker:${WORKER_VERSION:-dev}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${WORKER_VERSION:-dev}
        COMMIT: ${WORKER_COMMIT:-unknown}
    privileged: true
    network_mode: host
    # exit code 1 is a fatal error (config, lost queue) and is restarted; 0 is a clean exit
    restart: on-failure:5
    # room for the worker to end a running job and report it before Docker kills it
    stop_grace_period: 60s
    env_file:
      - ./orchestrator/.env
    environment:
      # the telemetry of the worker (docs/telemetry-contract.md); a second worker on this host needs its own
      # WORKER_ID, telemetry port, cache volume and a socket directory outside /var/tmp
      WORKER_ID: "${WORKER_ID:-compose-worker-1}"
      TELEMETRY_ADDR: "127.0.0.1:9464"
      LOG_FORMAT: "json"
      # the files of the wordlists are downloaded from this bucket and kept in the cache directory
      RUSTFS_WORDLISTS_BUCKET: wordlists
      WORDLIST_CACHE_DIR: /var/cache/automata/wordlists
      # 1.5 GB; the least recently used files are removed above it
      WORDLIST_CACHE_MAX_BYTES: "1610612736"
    volumes:
      - /var/tmp:/var/tmp
      # the cache survives restarts; give it a few GB more than the size above (the files of a running job are never removed)
      - wordlist_cache:/var/cache/automata/wordlists

volumes:
  wordlist_cache: